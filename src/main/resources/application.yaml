server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: business-finance
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business-finance-db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin@0234}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  logging:
    structured:
      format:
        console: ecs

app:
  api:
    error-base-uri: ${APP_ERROR_BASE_URI:http://localhost:8080/errors}
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:gestao-financeira}
      secret: ${APP_JWT_SECRET:default-32-bytes-secret-key-for-dev-and-test-env-2026}
      access-token-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:900}
      refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL_DAYS:7}
  storage:
    s3:
      endpoint: ${APP_S3_ENDPOINT:http://localhost:4566}
      region: ${APP_S3_REGION:us-east-1}
      bucket: ${APP_S3_BUCKET:fiscal-attachments}
      access-key: ${APP_S3_ACCESS_KEY:test}
      secret-key: ${APP_S3_SECRET_KEY:test}
      path-style-access-enabled: ${APP_S3_PATH_STYLE_ACCESS:true}
      auto-create-bucket: ${APP_S3_AUTO_CREATE_BUCKET:true}
  simulation:
    max-concurrent: ${APP_SIMULATION_MAX_CONCURRENT:4}
    grpc:
      host: ${APP_SIMULATION_GRPC_HOST:localhost}
      port: ${APP_SIMULATION_GRPC_PORT:50051}
      enabled: ${APP_SIMULATION_GRPC_ENABLED:false}
      fallback-enabled: ${APP_SIMULATION_GRPC_FALLBACK_ENABLED:true}
      deadline-ms: ${APP_SIMULATION_GRPC_DEADLINE_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus"]
