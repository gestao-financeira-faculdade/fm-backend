server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: business-finance
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business-finance-db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin@0234}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  logging:
    structured:
      format:
        console: ecs

management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus"]
